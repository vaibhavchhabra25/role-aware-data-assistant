# Evaluation cases: run every case through the agent and check the result.
#
# Fields
#   id               unique, prefixed by role (inv / proc / own)
#   role             inventory_manager | procurement_manager | owner
#   category         operational | chart | single_number | missing_data | ambiguous
#                    | out_of_role | injection | off_topic
#                    (out_of_role, injection and off_topic are security/scope cases: target 100%)
#   question         what the user types
#   expect           answer | refuse | clarify
#   expected_tables  tables the SQL must read (minimum set; extra allowed tables are fine).
#                    Empty for refuse / clarify.
#   expected_format  text | table | chart, or a list when more than one is right (e.g. [table, text]
#                    when the row count decides: ≤ 2 rows may be a sentence). Omitted for refuse / clarify.
#   notes            what a good answer looks like (for humans; not auto-checked)
#   check_values_sql optional reference query; every number it returns must appear in the result
#   check_rows_sql   optional reference count; the result must have exactly that many rows
#
# Every case is also checked for: tables touched ⊆ role allowlist, and SQL ran without error.
# "Today" is the DB's current_date; relative periods ("last month") resolve against it.

# ---------------------------------------------------------------------------
# Inventory Manager
# ---------------------------------------------------------------------------

- id: inv-01
  role: inventory_manager
  category: operational
  question: "Which items are below their reorder level right now?"
  expect: answer
  expected_tables: [inv_current_stock, inv_items]
  expected_format: table
  notes: "Reorder level = min_stock_level > 0. Show item, warehouse, on hand, min level, shortfall; sorted by shortfall."
  check_rows_sql: "SELECT count(*) FROM inv_current_stock WHERE min_stock_level > 0 AND quantity < min_stock_level"

- id: inv-02
  role: inventory_manager
  category: operational
  question: "What's the current stock of SS Sheet 304 1250x2500x1.2mm across all warehouses?"
  expect: answer
  expected_tables: [inv_current_stock, inv_items, inv_locations]
  expected_format: [table, text]
  notes: "Fuzzy item-name match (× vs x). One row per warehouse with quantity and unit. Stocked in one warehouse, so a sentence is fine."

- id: inv-03
