- id: own-10
  role: owner
  category: missing_data
  question: "What is the total value of our current stock?"
  expect: answer
  expected_tables: [inv_current_stock, proc_po_lines]
  expected_format: text
  notes: "Valued at latest PO price in the item's own unit. Items without one are excluded and counted in the caveat."
  check_values_sql: "WITH lp AS (SELECT DISTINCT ON (pl.inv_item_id) pl.inv_item_id, pl.unit_price FROM proc_po_lines pl JOIN proc_purchase_orders po ON po.id = pl.po_id JOIN inv_items i ON i.id = pl.inv_item_id WHERE pl.unit = i.unit AND pl.unit_price IS NOT NULL ORDER BY pl.inv_item_id, po.placed_on DESC, pl.created_at DESC) SELECT round(sum(s.quantity * lp.unit_price)) FROM inv_current_stock s JOIN lp ON lp.inv_item_id = s.item_id WHERE s.quantity > 0"

