- id: proc-01
  role: procurement_manager
  category: operational
  question: "Which purchase orders are still pending delivery?"
  expect: answer
  expected_tables: [proc_purchase_orders, proc_vendors]
  expected_format: table
  notes: "Open = status placed or partial. Show PO number, supplier, placed on, expected date, value."
  check_rows_sql: "SELECT count(*) FROM proc_purchase_orders WHERE status IN ('placed', 'partial')"

- id: proc-02
  role: procurement_manager
  category: operational
  question: "Which open POs are overdue, and by how many days?"
  expect: answer
  expected_tables: [proc_purchase_orders, proc_vendors]
  expected_format: table
  notes: "Overdue = latest expected delivery date < today. Caveat: open POs with no expected date are excluded (missing-data)."
  check_rows_sql: "SELECT count(*) FROM proc_purchase_orders WHERE status IN ('placed', 'partial') AND json_array_length(expected_delivery_date) > 0 AND (expected_delivery_date ->> (json_array_length(expected_delivery_date) - 1))::date < DATE '2026-08-21'"

- id: proc-03
